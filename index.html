<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Steady</title>
  <meta name="description" content="A calm, private place to keep track of deadlines, payments, contracts and your budget. Everything stays on your device.">
  <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161a1d" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <h1 id="title">Steady</h1>
      <button class="btn ghost small" data-act="focus-toggle" id="focusBtn" aria-pressed="false">Just one thing</button>
    </div>
  </header>

  <main id="main" tabindex="-1" aria-live="polite"></main>

  <button class="fab" data-act="add" aria-label="Add something">+</button>

  <nav class="tabs" aria-label="Sections">
    <button data-tab="today">Today</button>
    <button data-tab="money">Money</button>
    <button data-tab="contracts">Contracts</button>
    <button data-tab="deadlines">Deadlines</button>
    <button data-tab="more">More</button>
  </nav>

  <dialog id="dlg" aria-labelledby="dlgTitle"></dialog>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <noscript><p class="noscript">Steady needs JavaScript to run. It doesn't send anything anywhere — everything stays on your device.</p></noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
